<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Artful Raccoon Photography</title>
  <meta name="description" content="Wildlife, landscape, and astro photography.">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <header class="site-header">
    <span class="site-title">Artful <span class="accent">Raccoon</span></span>
    <nav class="site-tagline" id="site-tagline"></nav>
  </header>

  <div class="hero" id="hero"></div>

  <nav class="gallery-nav" id="gallery-nav"></nav>

  <main class="gallery-section" id="gallery-section"></main>

  <footer class="site-footer">
    &copy; <span id="year"></span> The Artful Raccoon Photography
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-fullscreen" id="lightbox-fullscreen" aria-label="View fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="8 3 3 3 3 8"></polyline>
        <polyline points="16 3 21 3 21 8"></polyline>
        <polyline points="3 16 3 21 8 21"></polyline>
        <polyline points="21 16 21 21 16 21"></polyline>
      </svg>
    </button>
    <div class="lightbox-inner">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      <div class="lightbox-img-wrap" id="lightbox-img-wrap">
        <img id="lightbox-img" alt="">
      </div>
      <div class="lightbox-meta">
        <div>
          <h2 id="lightbox-title"></h2>
          <p id="lightbox-desc"></p>
        </div>
        <div class="lightbox-side">
          <div class="lightbox-exif" id="lightbox-exif"></div>
          <div class="lightbox-map" id="lightbox-map" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <script>document.getElementById('year').textContent = new Date().getFullYear()</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
